<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <title>Vue</title>
</head>
<body class="container">
    <div class="my-4" id="app">
        <h2>Gestino de contador</h2>
        <p> Contador: {{contador}}</p>
        <button class="btn btn-primary mx-2" v-on:click=incrementar()>Incrementar</button>
        <button class="btn btn-primary mx-2" v-on:click=decrementar()>Decrementar</button>
    </div>
    <script src="/practica/Vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Ae1SxVbOcoF1IZNhPujFl4m+OGK/Ln9v9fW8ELKARcRBjR5t9I4KjyJ9EMoEh6vM" crossorigin="anonymous"></script>
</body>
</html>
