<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear un elemento</title>
</head>
<body>
    <h2>Creamos un elemento 'button'</h2>
    <script>
        const btn = document.createElement('button');
        btn.innerHTML = 'Soy un boton'
        document.body.appendChild(btn);
    </script>
</body>
</html>
